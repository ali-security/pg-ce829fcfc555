dist: xenial
sudo: false
language: go

addons:
  postgresql: "9.6"

go:
  - 1.13.x
  - 1.14.x
  - 1.16.x

env:
  - GO111MODULE=on

go_import_path: github.com/go-pg/pg

before_install:
  - psql -U postgres -c "CREATE EXTENSION hstore"

script:
  - go test -v ./...
  - go test ./... -short -race -timeout 8m
  - go test ./... -run=NONE -bench=. -benchmem
  - env GOOS=linux GOARCH=386 go test ./...
