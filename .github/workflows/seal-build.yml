name: seal-build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false
      - name: Build module-zip helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helper"
          cd "$RUNNER_TEMP/helper"
          cat > main.go <<'GOEOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              f, err := os.Create(os.Args[1])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              mv := module.Version{Path: os.Args[2], Version: os.Args[3]}
              if err := zip.CreateFromDir(f, mv, os.Args[4]); err != nil {
                  log.Fatal(err)
              }
          }
          GOEOF
          go mod init sealhelper
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/modzip" .
      - name: Create module zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/modsrc" "$GITHUB_WORKSPACE/dist"
          cp -a "$GITHUB_WORKSPACE/src/." "$RUNNER_TEMP/modsrc/"
          rm -rf "$RUNNER_TEMP/modsrc/.git" "$RUNNER_TEMP/modsrc/.github"
          "$RUNNER_TEMP/modzip" "$GITHUB_WORKSPACE/dist/v9.2.1.zip" github.com/go-pg/pg/v9 v9.2.1 "$RUNNER_TEMP/modsrc"
          unzip -l "$GITHUB_WORKSPACE/dist/v9.2.1.zip" | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/v9.2.1.zip
          if-no-files-found: error
